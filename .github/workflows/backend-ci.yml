name: Backend CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assetflow-backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/assetflow_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assetflow-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build
