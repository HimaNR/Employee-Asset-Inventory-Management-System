name: Frontend CI

on:
  push:
    branches: -dev

  pull_request:
    branches: -dev

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assetflow-frontend

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: assetflow-frontend/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Run lint
          run: npm run lint

        - name: Build frontend
          run: npm run build
