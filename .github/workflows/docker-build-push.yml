name: Docker Build and Push

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=latest" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./assetflow-backend
          file: ./assetflow-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/himanr/employee-asset-backend:${{ steps.tag.outputs.environment }}
            ghcr.io/himanr/employee-asset-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./assetflow-frontend
          file: ./assetflow-frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
          tags: |
            ghcr.io/himanr/employee-asset-frontend:${{ steps.tag.outputs.environment }}
            ghcr.io/himanr/employee-asset-frontend:${{ github.sha }}

      - name: Build and push PostgreSQL image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/postgres
          file: ./docker/postgres/Dockerfile
          push: true
          tags: |
            ghcr.io/himanr/employee-asset-postgres:${{ steps.tag.outputs.environment }}
            ghcr.io/himanr/employee-asset-postgres:${{ github.sha }}
